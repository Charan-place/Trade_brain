[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tbrain"
version = "0.1.0"
description = "Nifty 50 + Sensex options brain: live recorder, analytics, signal-only engine and live UI (personal research use)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "upstox-python-sdk>=2.30,<3",   # used ONLY for its protobuf decoder; we run our own TLS-verified websocket
  "websocket-client>=1.6",
  "protobuf>=5",
  "pyarrow>=15",
  "numpy>=1.26",
  "cryptography>=50.0.2",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.6"]                       # training-data storage (MONGODB_URI)
web = [                                        # hosted app: Google sign-in, Upstox connect, live dashboard
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "authlib>=1.3",
  "itsdangerous>=2.1",
  "httpx>=0.27",
  "cryptography>=42",
]

[project.scripts]
tbrain = "tbrain.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mongomock>=4.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/tbrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
