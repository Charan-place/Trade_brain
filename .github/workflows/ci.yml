name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        run: uv sync --locked --all-extras --python ${{ matrix.python }}
      - name: Tests (offline - no broker credentials needed)
        run: uv run pytest -q
